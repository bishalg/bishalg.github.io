<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Architect's Universe | Bishal Ghimire</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="gstatic" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Courier+Prime:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="loader" class="loader">
        <div class="loader-content">
            <div class="loader-text">INITIALIZING COSMIC TIMELINE...</div>
            <div class="loader-bar"></div>
        </div>
    </div>

    <!-- WebGL Canvas (Background) -->
    <canvas id="cosmic-canvas"></canvas>

    <!-- Scroll Container with CSS Snap -->
    <main class="scroll-container" id="scroll-container">

        <!-- Page 0: Welcome -->
        <section class="page page--welcome" id="welcome">
            <div class="hud-frame hud-frame--hero">
                <div class="hud-line hud-line--top"></div>
                <h1 class="hero-title">BISHAL GHIMIRE</h1>
                <p class="hero-subtitle">Cosmic Coder</p>
                <button id="time-travel-btn" class="scroll-indicator" aria-label="Start time travel to explore planets">
                    <span>LET'S TIME TRAVEL?</span>
                    <div class="arrow">↓</div>
                </button>
            </div>
        </section>

        <!-- Earth: Pages 1-4 -->
        <section class="page page--planet" id="earth-0" data-planet="earth" data-card="0"></section>
        <section class="page page--card" id="earth-1" data-planet="earth" data-card="1"></section>
        <section class="page page--card" id="earth-2" data-planet="earth" data-card="2"></section>
        <section class="page page--card" id="earth-3" data-planet="earth" data-card="3"></section>

        <!-- Sun: Pages 5-8 -->
        <section class="page page--planet" id="sun-0" data-planet="sun" data-card="0"></section>
        <section class="page page--card" id="sun-1" data-planet="sun" data-card="1"></section>
        <section class="page page--card" id="sun-2" data-planet="sun" data-card="2"></section>
        <section class="page page--card" id="sun-3" data-planet="sun" data-card="3"></section>

        <!-- Moon: Pages 9-12 -->
        <section class="page page--planet" id="moon-0" data-planet="moon" data-card="0"></section>
        <section class="page page--card" id="moon-1" data-planet="moon" data-card="1"></section>
        <section class="page page--card" id="moon-2" data-planet="moon" data-card="2"></section>
        <section class="page page--card" id="moon-3" data-planet="moon" data-card="3"></section>

        <!-- Mars: Pages 13-16 -->
        <section class="page page--planet" id="mars-0" data-planet="mars" data-card="0"></section>
        <section class="page page--card" id="mars-1" data-planet="mars" data-card="1"></section>
        <section class="page page--card" id="mars-2" data-planet="mars" data-card="2"></section>
        <section class="page page--card" id="mars-3" data-planet="mars" data-card="3"></section>

        <!-- Mercury: Pages 17-20 -->
        <section class="page page--planet" id="mercury-0" data-planet="mercury" data-card="0"></section>
        <section class="page page--card" id="mercury-1" data-planet="mercury" data-card="1"></section>
        <section class="page page--card" id="mercury-2" data-planet="mercury" data-card="2"></section>
        <section class="page page--card" id="mercury-3" data-planet="mercury" data-card="3"></section>

        <!-- Jupiter: Pages 21-24 -->
        <section class="page page--planet" id="jupiter-0" data-planet="jupiter" data-card="0"></section>
        <section class="page page--card" id="jupiter-1" data-planet="jupiter" data-card="1"></section>
        <section class="page page--card" id="jupiter-2" data-planet="jupiter" data-card="2"></section>
        <section class="page page--card" id="jupiter-3" data-planet="jupiter" data-card="3"></section>

        <!-- Venus: Pages 25-28 -->
        <section class="page page--planet" id="venus-0" data-planet="venus" data-card="0"></section>
        <section class="page page--card" id="venus-1" data-planet="venus" data-card="1"></section>
        <section class="page page--card" id="venus-2" data-planet="venus" data-card="2"></section>
        <section class="page page--card" id="venus-3" data-planet="venus" data-card="3"></section>

        <!-- Saturn: Pages 29-32 -->
        <section class="page page--planet" id="saturn-0" data-planet="saturn" data-card="0"></section>
        <section class="page page--card" id="saturn-1" data-planet="saturn" data-card="1"></section>
        <section class="page page--card" id="saturn-2" data-planet="saturn" data-card="2"></section>
        <section class="page page--card" id="saturn-3" data-planet="saturn" data-card="3"></section>

        <!-- Neptune: Pages 33-36 -->
        <section class="page page--planet" id="neptune-0" data-planet="neptune" data-card="0"></section>
        <section class="page page--card" id="neptune-1" data-planet="neptune" data-card="1"></section>
        <section class="page page--card" id="neptune-2" data-planet="neptune" data-card="2"></section>
        <section class="page page--card" id="neptune-3" data-planet="neptune" data-card="3"></section>

        <!-- Page 37: End -->
        <section class="page page--end" id="end">
            <div class="contact-frame">
                <h2>END TRANSMISSION</h2>
                <div class="contact-links">
                    <a href="#" class="hud-btn">LINKEDIN</a>
                    <a href="#" class="hud-btn">GITHUB</a>
                    <a href="#" class="hud-btn">EMAIL</a>
                </div>
            </div>
        </section>
    </main>


    <!-- GSAP (loaded globally for compatibility) -->
    <script src="https://unpkg.com/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>

    <!-- Lenis (loaded globally) -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>

    <!-- Core Logic -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
    <script type="module" src="./src/main.js"></script>
</body>

</html>
